name: Release skills

# Validates the skills, then builds one zip per skill folder and attaches them
# to a GitHub release.
#
# Each zip is built from *inside* skills/ so the skill folder sits at the
# archive root (skill-name/SKILL.md). Web-UI skill uploads expect that shape,
# and GitHub's own source download nests it a level too deep — which is the
# whole reason this workflow exists.
#
# Validation shares scripts/validate.py with the Validate workflow, so the
# check logic lives in exactly one place.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skills and manifests
        run: |
          python -m pip install --quiet pyyaml
          python scripts/validate.py

      - name: Build one zip per skill
        run: |
          mkdir -p dist
          shopt -s nullglob
          for dir in skills/*/; do
            name="$(basename "$dir")"
            (cd skills && zip -r "../dist/${name}.zip" "$name" -x "*.DS_Store")
          done
          echo "Built:"
          ls -l dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi
